<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor" role="img" aria-label="Retro desktop computer tower with monitor">
  <title>Retro desktop computer tower with monitor</title>

  <!-- Monitor -->
  <rect x="2" y="16" width="28" height="20" rx="3"/>
  <rect x="6" y="20" width="20" height="12" fill="white"/>

  <!-- Monitor stand (thick + visible at small sizes) -->
  <rect x="12" y="36" width="8" height="4"/>
  <rect x="9" y="40" width="14" height="4"/>

  <!-- Tower -->
  <rect x="34" y="12" width="28" height="32" rx="2"/>

  <!-- Drive bay (high-contrast cutout) -->
  <rect x="38" y="16" width="20" height="4" fill="white"/>

  <!-- Power button (scaled for visibility) -->
  <circle cx="48" cy="36" r="3" fill="white"/>
</svg>
