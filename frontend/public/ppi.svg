<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PC Parts Inventory logo">
  <title>PC Parts Inventory logo</title>

  <!-- Charcoal tile -->
  <rect width="32" height="32" fill="#141210"/>

  <!-- Amber frame (3px) -->
  <rect x="4" y="4" width="24" height="24" fill="#f0a532"/>
  <rect x="7" y="7" width="18" height="18" fill="#141210"/>

  <!-- 2x2 cell grid: amber top-left / bottom-right, muted top-right / bottom-left -->
  <rect x="10" y="10" width="5" height="5" fill="#f0a532"/>
  <rect x="17" y="10" width="5" height="5" fill="#4a443c"/>
  <rect x="10" y="17" width="5" height="5" fill="#4a443c"/>
  <rect x="17" y="17" width="5" height="5" fill="#f0a532"/>
</svg>
